[package]
name = "nu_plugin_net"
license = "MIT"
authors = ["Carson <c@rson.riker.me>"]
keywords = ["nushell", "network", "plugin"]
homepage = "https://github.com/fennewald/nu_plugin_net"
repository = "https://github.com/fennewald/nu_plugin_net"
description = "A nushell plugin for enumerating network interfaces in a platform-agnostic way"
version = "1.10.0"
edition = "2021"
readme = "README.md"


[dependencies]
anyhow = "1.0.98"
futures = { version = "0.3.31", default-features = false, features = ["alloc", "async-await", "std"] }
interprocess = "2.2.3"
log = "0.4.27"
nix = { version = "0.30.1", features = ["fs", "poll", "signal"] }
nu-plugin = "0.104.0"
nu-plugin-core = "0.104.0"
nu-plugin-protocol = "0.104.0"
nu-protocol = { version = "0.104.0", features = ["plugin"] }
pin-project-lite = "0.2.16"
pretty_env_logger = "0.5.0"
serde_json = "1.0.140"
thiserror = "2.0.12"
